data:
  urls: data/uwf_urls.txt
  raw_dir: data/raw
  processed_dir: data/processed
  memory_limit: 4GB
  threads: 2

splits:
  baseline_days: 7
  validation_fraction: 0.05
  holdout_start: "2025-01-01T00:00:00Z"
  window: 1h

features:
  numeric: [orig_bytes, resp_bytes, orig_pkts, resp_pkts, orig_ip_bytes, resp_ip_bytes]
  categorical: [protocol, service, conn_state, history, local_orig, local_resp]
  top_k_dest_ports: 32
  ocsvm_expected_width: 83
  ae_expected_width: 94
  unknown_category_token: "<unknown>"

models:
  ocsvm:
    kernel: rbf
    gamma: 0.02
    nu: 0.001
    cache_size: 200
    tolerance: 0.001
    shrinking: false
    scoring_threads: 8
    random_state: 42
  ae:
    hidden_dims: [256, 128, 64]
    latent_dim: 32
    activation: relu
    normalization: layernorm
    dropout: 0.0
    categorical_loss: cross_entropy
    training_numeric_weight: 0.50
    scoring_numeric_weight: 0.10
    epochs: 80
    batch_size: 1024
    learning_rate: 0.001
    weight_decay: 0.0001
    patience: 12
    internal_validation_fraction: 0.05
    random_state: 42
    device: auto

thresholds:
  ocsvm_quantile: 0.9995
  ae_quantile: 0.98

search:
  target_recall: 0.998
  ocsvm:
    gamma: [0.01, 0.02, 0.04]
    nu: [0.001, 0.002]
    quantiles: [0.999, 0.99925, 0.9995]
  ae:
    training_numeric_weight: [0.25, 0.50, 0.75]
    scoring_numeric_weight: [0.05, 0.10, 0.25]
    seeds: [7, 42, 123]

fusion:
  alpha_start: 0.0
  alpha_stop: 1.0
  alpha_step: 0.025

benchmark:
  training_rows: [100000, 200000, 400000]
  inference_rows: [10000, 100000, 1000000]
  inference_repetitions: 3
  warmup_rows: 512

artifacts:
  models_dir: artifacts/models
  preprocessors_dir: artifacts/preprocessors
  thresholds_dir: artifacts/thresholds
  score_cache_dir: artifacts/score_cache
  reports_dir: artifacts/reports
