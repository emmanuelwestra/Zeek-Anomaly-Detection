[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ndr"
version = "0.1.0"
description = "Static OC-SVM and mixed autoencoder baselines for UWF network-flow anomaly detection."
readme = "README.md"
requires-python = ">=3.14"
license = {file = "LICENSE"}
dependencies = [
  "duckdb>=1.4",
  "joblib>=1.4",
  "numpy>=2.2",
  "pandas>=2.2",
  "pyarrow>=18",
  "PyYAML>=6",
  "scikit-learn>=1.6",
  "torch>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.11"]

[project.scripts]
ndr = "ndr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
